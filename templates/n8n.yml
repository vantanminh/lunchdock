slug: n8n
name: n8n
description: Workflow automation with a visual editor and hundreds of integrations.
category: Automation
tags: [workflows, automation, integrations, low-code]
website: https://n8n.io
main_service: n8n
port: 5678
notes: Create the owner account on first visit. Keep N8N_ENCRYPTION_KEY; credentials are unreadable without it.
variables:
  - name: DOMAIN
    label: Domain
    kind: domain
  - name: N8N_ENCRYPTION_KEY
    label: Encryption key
    kind: secret
    length: 48
  - name: TIMEZONE
    label: Timezone
    kind: string
    default: UTC
compose: |
  services:
    n8n:
      image: n8nio/n8n:stable
      restart: unless-stopped
      environment:
        N8N_HOST: ${DOMAIN}
        N8N_PORT: "5678"
        N8N_PROTOCOL: https
        WEBHOOK_URL: https://${DOMAIN}/
        N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
        GENERIC_TIMEZONE: ${TIMEZONE}
        TZ: ${TIMEZONE}
        N8N_RUNNERS_ENABLED: "true"
      volumes:
        - n8n_data:/home/node/.n8n
  volumes:
    n8n_data: {}
