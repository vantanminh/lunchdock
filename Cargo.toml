[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/node",
    "crates/proto",
    "crates/server",
    "crates/agent",
    "crates/cache",
    "crates/cli",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
