[package]
name = "rudder-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Rudder control plane"

[[bin]]
name = "rudder-server"
path = "src/main.rs"

[dependencies]
rudder-core = { path = "../core", features = ["openapi"] }
rudder-node = { path = "../node" }
rudder-proto = { path = "../proto" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
tower = "0.5.3"
base64 = "0.23.1"
uuid = { workspace = true, features = ["v4", "serde"] }
tower-http = { version = "0.7.1", features = ["trace"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "chrono", "json", "macros"] }
argon2 = "0.6.0"
cookie = "0.18"
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth"] }
governor = "0.10.4"
subtle = "2.6.1"
sha2 = "0.11.0"
hex = "0.4.3"
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
mime_guess = "2.0.5"
axum-extra = { version = "0.12.6", features = ["cookie"] }
utoipa = { version = "6.0.0", features = ["chrono", "uuid", "axum_extras"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
bollard = "0.21.1"
async-trait = "0.1.92"
bytes = "1.12.1"
futures-util = "0.3.34"
bcrypt = "0.19.3"
ssh-key = { version = "0.6.7", features = ["ed25519"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
async-compression = { version = "0.4.50", features = ["tokio", "gzip", "zstd"] }
tokio-util = { version = "0.7.20", features = ["io", "io-util"] }
tar = "0.4.46"
globset = "0.4"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
hmac = "0.13"
tonic = { version = "0.14.5", features = ["tls-aws-lc"] }
tokio-stream = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "x509-parser", "aws_lc_rs"] }
time = "0.3"
rand_core06 = { version = "0.6", package = "rand_core", features = ["getrandom"] }

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "aws_lc_rs"] }
x509-parser = "0.18"
rudder-agent = { path = "../agent" }
tower = { version = "0.5.3", features = ["util"] }
tokio-tungstenite = "0.29.0"
