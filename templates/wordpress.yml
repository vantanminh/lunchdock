slug: wordpress
name: WordPress
description: WordPress with a MariaDB database, ready for HTTPS behind Traefik.
category: CMS
tags: [blog, cms, php, mariadb]
website: https://wordpress.org
main_service: wordpress
port: 80
notes: Run the installer on first visit. Pair the domain with the WordPress cache preset in Cache settings.
variables:
  - name: DOMAIN
    label: Domain
    kind: domain
  - name: DB_PASSWORD
    label: Database password
    kind: secret
  - name: DB_ROOT_PASSWORD
    label: Database root password
    kind: secret
compose: |
  services:
    wordpress:
      image: wordpress:6-apache
      restart: unless-stopped
      environment:
        WORDPRESS_DB_HOST: db
        WORDPRESS_DB_USER: wordpress
        WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
        WORDPRESS_DB_NAME: wordpress
        WORDPRESS_CONFIG_EXTRA: |
          if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
      volumes:
        - wp_data:/var/www/html
      depends_on:
        - db
    db:
      image: mariadb:11.4
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: wordpress
        MARIADB_USER: wordpress
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      volumes:
        - wp_db:/var/lib/mysql
  volumes:
    wp_data: {}
    wp_db: {}
