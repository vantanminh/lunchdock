slug: minio
name: MinIO
description: S3-compatible object storage. Uses the maintained pgsty community build because upstream stopped publishing images.
category: Storage
tags: [s3, object-storage, backups]
website: https://github.com/pgsty/minio
main_service: minio
port: 9000
notes: The domain serves the S3 API. Add it as an S3 destination with path-style addressing to store Rudder backups.
variables:
  - name: DOMAIN
    label: S3 API domain
    kind: domain
  - name: MINIO_ROOT_USER
    label: Root user
    kind: string
    default: rudder
  - name: MINIO_ROOT_PASSWORD
    label: Root password
    kind: secret
    length: 40
compose: |
  services:
    minio:
      image: pgsty/minio:latest
      restart: unless-stopped
      command: server /data --console-address ":9001"
      environment:
        MINIO_ROOT_USER: ${MINIO_ROOT_USER}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        MINIO_SERVER_URL: https://${DOMAIN}
      volumes:
        - minio_data:/data
  volumes:
    minio_data: {}
