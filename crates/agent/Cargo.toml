[package]
name = "rudder-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Rudder node agent"

[[bin]]
name = "rudder-agent"
path = "src/main.rs"

[dependencies]
rudder-core = { path = "../core" }
rudder-node = { path = "../node" }
rudder-proto = { path = "../proto" }
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes = "1.12.1"
futures-util = "0.3.34"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio-stream = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tonic = { version = "0.14.5", features = ["tls-aws-lc"] }
