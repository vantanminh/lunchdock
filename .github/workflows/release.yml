name: Release

# Builds static musl binaries for x86_64 and aarch64, multi-arch panel and cache
# images, and a GitHub release whose SHA256SUMS is signed with minisign.
#
# Repository settings this workflow needs:
#   - variable RUDDER_UPDATE_PUBKEY: the minisign public key (base64 line), compiled
#     into the panel so it can verify releases.
#   - secret MINISIGN_SECRET_KEY: the matching secret key file contents, created
#     with `minisign -G -W` (no password; the secret store protects it).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Signing configuration is present
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          RUDDER_UPDATE_PUBKEY: ${{ vars.RUDDER_UPDATE_PUBKEY }}
        run: |
          missing=""
          [ -n "$MINISIGN_SECRET_KEY" ] || missing="$missing secret:MINISIGN_SECRET_KEY"
          [ -n "$RUDDER_UPDATE_PUBKEY" ] || missing="$missing variable:RUDDER_UPDATE_PUBKEY"
          if [ -n "$missing" ]; then
            echo "::error::set these repository settings before tagging a release:$missing"
            exit 1
          fi

  binaries:
    name: binaries (${{ matrix.target }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: |
          pip install ziglang==0.15.2
          cargo install cargo-zigbuild --locked --version 0.23.4

      - name: Build
        env:
          RUDDER_UPDATE_PUBKEY: ${{ vars.RUDDER_UPDATE_PUBKEY }}
        run: |
          export RUDDER_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          cargo zigbuild --release --target ${{ matrix.target }} \
            -p rudder-server -p rudder-cache -p rudder-agent -p rudder-cli

      - name: Stage
        run: |
          out=out/${{ matrix.arch }}
          mkdir -p "$out"
          for bin in rudder-server rudder-cache rudder-agent rudder; do
            cp "target/${{ matrix.target }}/release/$bin" "$out/$bin-${{ matrix.target }}"
          done
          "$out/rudder-agent-${{ matrix.target }}" --version || true

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: out/${{ matrix.arch }}

  images:
    needs: binaries
    runs-on: ubuntu-latest
    outputs:
      panel: ${{ steps.panel.outputs.digest }}
      cache: ${{ steps.cache.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true

      - name: Lay out dist/ for the Dockerfiles
        run: |
          mkdir -p dist/agents
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            arch=${pair%%:*}
            target=${pair#*:}
            install -m 0755 "bin/rudder-server-$target" "dist/rudder-server-$arch"
            install -m 0755 "bin/rudder-cache-$target" "dist/rudder-cache-$arch"
            install -m 0755 "bin/rudder-agent-$target" "dist/agents/rudder-agent-$target"
            (cd dist/agents && sha256sum "rudder-agent-$target" > "rudder-agent-$target.sha256")
          done

      - name: Image names
        id: names
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version="${GITHUB_REF_NAME#v}"
          echo "panel=ghcr.io/$owner/rudder" >> "$GITHUB_OUTPUT"
          echo "cache=ghcr.io/$owner/rudder-cache" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;; *) echo "latest=true" >> "$GITHUB_OUTPUT" ;; esac

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Panel image
        id: panel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/panel.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.panel }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.latest == 'true' && format('{0}:latest', steps.names.outputs.panel) || '' }}

      - name: Cache image
        id: cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/cache.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.cache }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.latest == 'true' && format('{0}:latest', steps.names.outputs.cache) || '' }}

  release:
    needs: [binaries, images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Write release.json and SHA256SUMS
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/agents
          mv dist/rudder-agent-* dist/agents/
          cp deploy/install.sh deploy/install-agent.sh dist/
          sh deploy/release/make-release.sh "$version" dist \
            "ghcr.io/$owner/rudder:$version@${{ needs.images.outputs.panel }}" \
            "ghcr.io/$owner/rudder-cache:$version@${{ needs.images.outputs.cache }}"
          rm -rf dist/agents
          cat dist/release.json

      - name: Sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          RUDDER_UPDATE_PUBKEY: ${{ vars.RUDDER_UPDATE_PUBKEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/rudder.key"
          minisign -S -s "$RUNNER_TEMP/rudder.key" -m dist/SHA256SUMS -t "rudder ${GITHUB_REF_NAME#v}"
          rm -f "$RUNNER_TEMP/rudder.key"
          minisign -V -P "$RUDDER_UPDATE_PUBKEY" -m dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Rudder $GITHUB_REF_NAME" --generate-notes $flags
