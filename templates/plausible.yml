slug: plausible
name: Plausible Analytics
description: Lightweight, open source, privacy-friendly analytics (Community Edition).
category: Analytics
tags: [analytics, privacy, clickhouse]
website: https://plausible.io/self-hosted-web-analytics
main_service: plausible
port: 8000
notes: Register the first user on first visit, then set DISABLE_REGISTRATION to invite_only. ClickHouse needs about 1 GiB of RAM.
variables:
  - name: DOMAIN
    label: Domain
    kind: domain
  - name: SECRET_KEY_BASE
    label: Secret key base
    kind: secret
    length: 64
  - name: DB_PASSWORD
    label: Database password
    kind: secret
  - name: DISABLE_REGISTRATION
    label: Registration
    kind: string
    default: "false"
    description: false, true, or invite_only
compose: |
  services:
    plausible:
      image: ghcr.io/plausible/community-edition:v2.1.5
      restart: unless-stopped
      command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
      environment:
        BASE_URL: https://${DOMAIN}
        SECRET_KEY_BASE: ${SECRET_KEY_BASE}
        DATABASE_URL: postgres://postgres:${DB_PASSWORD}@plausible_db:5432/plausible_db
        CLICKHOUSE_DATABASE_URL: http://plausible_events_db:8123/plausible_events_db
        DISABLE_REGISTRATION: ${DISABLE_REGISTRATION}
      depends_on:
        - plausible_db
        - plausible_events_db
    plausible_db:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - db_data:/var/lib/postgresql/data
    plausible_events_db:
      image: clickhouse/clickhouse-server:24.12-alpine
      restart: unless-stopped
      environment:
        CLICKHOUSE_SKIP_USER_SETUP: "1"
      volumes:
        - event_data:/var/lib/clickhouse
        - event_logs:/var/log/clickhouse-server
      ulimits:
        nofile:
          soft: 262144
          hard: 262144
  volumes:
    db_data: {}
    event_data: {}
    event_logs: {}
